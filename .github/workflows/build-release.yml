name: Build Release APK

# Builds a signed, UNIVERSAL release APK (armeabi-v7a + arm64-v8a in one file)
# that installs on every device running Android 7.0+ (minSdk 24).
#
# Notes:
#   * The Gradle wrapper is not committed to this repo, so the workflow pins the
#     Android-Studio-Bumblebee-era toolchain that matches AGP 7.0.2:
#     JDK 11 + Gradle 7.3.3 + Android platform 33.
#   * The `opensdk` virtualization module is a git submodule whose directory may
#     be missing; the workflow restores it from GitHub automatically.
#   * APKs are zipalign-ed for 16 KB page-size devices (Android 15+) when the
#     installed build-tools support it, then signed with APK Signature Scheme
#     v2 + v3.
#
# Optional repository secrets (if absent, an ephemeral CI keystore is generated
# and uploaded as a build artifact so the exact signing key is never lost):
#   KEYSTORE_BASE64    - base64-encoded .jks/.keystore file
#   KEYSTORE_PASSWORD  - keystore password
#   KEY_ALIAS          - key alias
#   KEY_PASSWORD       - key password

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '11'        # AGP 7.0.2 requires JDK 11 (JDK 17 breaks it)
  GRADLE_VERSION: '7.3.3'   # wrapper is missing; pin the AGP 7.0.2 pairing
  BUILD_TOOLS_VERSION: '34.0.0'

jobs:
  build:
    name: Build universal release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore opensdk engine module
        shell: bash
        run: |
          set -euo pipefail
          # Case 1: the submodule gitlink exists and can be fetched.
          if [ ! -f opensdk/build.gradle ] && [ -f .gitmodules ]; then
            git submodule update --init --recursive || true
          fi
          # Case 2: submodule missing/unfetchable -> clone the engine directly.
          if [ ! -f opensdk/build.gradle ]; then
            rm -rf opensdk
            git clone --depth 1 https://github.com/WaxMoon/opensdk.git opensdk
          fi
          test -f opensdk/build.gradle
          echo "opensdk engine ready @ $(git -C opensdk rev-parse --short HEAD)"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;${BUILD_TOOLS_VERSION}"

      - name: Build release APK
        shell: bash
        env:
          GRADLE_OPTS: '-Xmx4g -Dfile.encoding=UTF-8'
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Determine version and output name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' build.gradle | head -n1)"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${BASE_VERSION:-1.0.0}-b${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk=VCamera-${VERSION}-universal.apk" >> "$GITHUB_OUTPUT"
          echo "Building VCamera ${VERSION}"

      - name: Align (16 KB page-size ready) and sign APK
        id: sign
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          IN="$(ls app/build/outputs/apk/release/*-unsigned.apk | head -n1)"
          ALIGNED="${RUNNER_TEMP}/aligned.apk"
          mkdir -p dist

          # 16 KB page-size alignment (Android 15+ devices). Falls back to
          # classic 4 KB alignment if this build-tools lacks the -P flag.
          USED_16K=false
          if "${BT}/zipalign" -P 16 -f -v 4 "${IN}" "${ALIGNED}" 2>/dev/null; then
            USED_16K=true
          else
            "${BT}/zipalign" -f -v 4 "${IN}" "${ALIGNED}"
          fi

          # Signing key: repository secrets if provided, otherwise generate an
          # ephemeral key and ship it as an artifact for future reuse.
          KEYSTORE="${RUNNER_TEMP}/vcamera-release.jks"
          GENERATED=false
          if [ -n "${KEYSTORE_BASE64}" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE}"
            STOREPASS="${KEYSTORE_PASSWORD}"
            KEYPASS="${KEY_PASSWORD}"
            KEYALIAS="${KEY_ALIAS}"
          else
            keytool -genkeypair -v -keystore "${KEYSTORE}" -alias vcamera \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass vcamera-ci -keypass vcamera-ci \
              -dname "CN=VCamera CI, O=VCamera, C=US" > /dev/null 2>&1
            STOREPASS="vcamera-ci"
            KEYPASS="vcamera-ci"
            KEYALIAS="vcamera"
            GENERATED=true
          fi

          OUT="dist/${{ steps.meta.outputs.apk }}"
          "${BT}/apksigner" sign \
            --ks "${KEYSTORE}" \
            --ks-key-alias "${KEYALIAS}" \
            --ks-pass "pass:${STOREPASS}" \
            --key-pass "pass:${KEYPASS}" \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "${OUT}" "${ALIGNED}"

          "${BT}/apksigner" verify --verbose "${OUT}" > "${RUNNER_TEMP}/signature-info.txt"
          echo "generated=${GENERATED}" >> "$GITHUB_OUTPUT"
          echo "used_16k=${USED_16K}" >> "$GITHUB_OUTPUT"
          echo "path=${OUT}" >> "$GITHUB_OUTPUT"
          echo "--- signature ---"
          cat "${RUNNER_TEMP}/signature-info.txt"

      - name: Verify universal compatibility
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          APK="${{ steps.sign.outputs.path }}"
          FAIL=0

          # 1) Every-device check: one APK must carry native code for BOTH
          #    32-bit (old/budget phones) and 64-bit ARM devices.
          LIBS="$(unzip -l "${APK}" | awk '{print $4}' | grep '^lib/.*\.so$' || true)"
          if [ -n "${LIBS}" ]; then
            for ABI in armeabi-v7a arm64-v8a; do
              if echo "${LIBS}" | grep -q "^lib/${ABI}/"; then
                echo "OK   native libs present: ${ABI}"
              else
                echo "FAIL native libs missing: ${ABI}"
                FAIL=1
              fi
            done
          else
            echo "::warning::APK contains no lib/*.so - camera engine AAR was not present in app/libs. Sandbox still works; drop camera-*.aar into app/libs to restore virtual-camera hooks."
          fi

          # 2) Alignment check (16 KB when supported, else classic 4 KB).
          if [ "${{ steps.sign.outputs.used_16k }}" = "true" ]; then
            "${BT}/zipalign" -c -P 16 4 "${APK}" && echo "OK   16 KB page alignment"
          else
            "${BT}/zipalign" -c 4 "${APK}" && echo "OK   4 KB alignment"
          fi

          # 3) Report minSdk / version from the packaged manifest.
          BADGING="$("${BT}/aapt2" dump badging "${APK}" 2>/dev/null \
            || "${BT}/aapt" dump badging "${APK}" 2>/dev/null || true)"
          MINSDK="$(echo "${BADGING}" | sed -n "s/.*sdkVersion:'\([0-9]*\)'.*/\1/p" | head -n1)"
          echo "minSdk=${MINSDK:-unknown} (Android $(python3 -c "print({24:'7.0',26:'8.0',28:'9',31:'12'}.get(${MINSDK:-0}, '?'))" 2>/dev/null || echo '?')+)"

          if [ "${FAIL}" -ne 0 ]; then
            echo "::error::APK is not universal - aborting"
            exit 1
          fi

          SIZE="$(du -h "${APK}" | cut -f1)"
          {
            echo "## VCamera ${{ steps.meta.outputs.version }}"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| APK | \`${{ steps.meta.outputs.apk }}\` |"
            echo "| Size | ${SIZE} |"
            echo "| ABIs | $(echo "${LIBS}" | cut -d/ -f2 | sort -u | paste -sd ', ' -) |"
            echo "| minSdk | ${MINSDK:-unknown} (Android 7.0+) |"
            echo "| Alignment | $([ "${{ steps.sign.outputs.used_16k }}" = "true" ] && echo '16 KB ready' || echo '4 KB') |"
            echo "| Signature | v2 + v3 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCamera-${{ steps.meta.outputs.version }}-universal
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload CI keystore (generated builds only)
        if: steps.sign.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-keystore
          path: ${{ runner.temp }}/vcamera-release.jks
          retention-days: 90
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/*.apk \
            --title "VCamera ${{ steps.meta.outputs.version }}" \
            --generate-notes \
          || gh release upload "${GITHUB_REF_NAME}" dist/*.apk --clobber
