# Project-wide Gradle settings.
# This file was never committed before (the .gitignore excluded it), which made
# every fresh checkout - including CI - fail with missing AndroidX flags.

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# The app is fully AndroidX (androidx.* + Jetpack libraries).
android.useAndroidX=true

# Two JCenter-era dependencies (com.imuxuan:floatingview:1.6 and
# com.github.nukc.stateview:kotlin:2.2.0) are still built against the old
# com.android.support libraries. Jetifier rewrites them to AndroidX at build
# time so old and new support libraries can coexist.
android.enableJetifier=true

# AGP 7.0.2 is only officially tested up to compileSdk 31; compiling against 33
# works (this project ships with it) but would otherwise print a loud warning.
android.suppressUnsupportedCompileSdk=33
