plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId rootProject.ext.masterPkg
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
    }


    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            // The original `virtual.camera.camera:camera` Maven repo was deleted
            // (and catloadinglibrary/RVAdapter were JCenter-only, which is also
            // dead), so local stand-in classes under src/standin/java provide the
            // exact same APIs. If a real camera engine AAR (camera-*.aar) is
            // dropped into app/libs, the stand-ins are skipped automatically to
            // avoid duplicate classes.
            if (fileTree(dir: 'libs', include: ['camera-*.aar', 'camera.jar']).isEmpty()) {
                java.srcDirs += 'src/standin/java'
            }
            // Always-on compat sources (independent of the camera AAR gate):
            //  * src/compat/java - StateView vendored from github.com/nukc/StateView
            //    v2.2.0 (MIT) + a FloatingMagnetView stand-in, replacing the two
            //    dead JCenter-only Maven artifacts.
            //  * src/compat/res  - StateView's default state layouts/attrs/strings.
            java.srcDirs += 'src/compat/java'
            res.srcDirs += 'src/compat/res'
        }
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
    dexOptions {
        preDexLibraries false
        maxProcessCount 8
        javaMaxHeapSize "4g"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    aaptOptions {
        cruncherEnabled = false
        useNewCruncher = false
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable "UnusedResources", 'RestrictedApi'
        textOutput "stdout"
        textReport false
        check 'NewApi', 'InlinedApi'
    }
}


tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}


repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])

    //android
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.core:core-ktx:1.3.2'
    implementation 'androidx.appcompat:appcompat:1.3.0-rc01'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation "androidx.recyclerview:recyclerview:1.2.0"
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation "androidx.activity:activity-ktx:1.2.2"
    implementation "androidx.fragment:fragment-ktx:1.3.3"
    implementation "androidx.preference:preference-ktx:1.1.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.3.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.3.1"
    implementation 'com.tbuonomo:dotsindicator:4.2'
    implementation 'com.afollestad.material-dialogs:core:3.3.0'
    implementation 'com.afollestad.material-dialogs:input:3.3.0'
    implementation 'com.github.Ferfalk:SimpleSearchView:0.2.0'
    implementation 'com.github.Othershe:CornerLabelView:1.0.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.11'
    // REMOVED: com.github.nukc.stateview:kotlin:2.2.0 and
    //          com.imuxuan:floatingview:1.6
    // Both were published ONLY to the dead JCenter. Their sources now live in
    // src/compat (see sourceSets above), so the build needs no extra mirror
    // repository and cannot break when a mirror goes down.

    implementation project(':opensdk')
    // NOTE: 'virtual.camera.camera:camera:1.0.0' (CameraLib) was removed - its
    // host repository no longer exists. See src/standin/java for the local
    // replacement, and app/libs/camera-*.aar as the drop-in slot for the real
    // camera engine if you have it.
}
